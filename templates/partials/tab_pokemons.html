<div class="panel active" id="panel-pokemon">
  <div class="panel-title">🎮 Pokemony</div>

  <!-- Box Analytics Section -->
  <div class="card" style="margin-bottom:16px; border-color: rgba(163,240,80,.15);">
    <div class="card-title" style="display:flex; justify-content:space-between; align-items:center; cursor:pointer;" onclick="toggleAnalytics()">
      <span id="lbl-box-analytics">📊 Statystyki Boxa</span>
      <span id="analytics-toggle-icon">▼</span>
    </div>
    <div id="analytics-content" style="display:none; padding-top:12px;">
      <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap:16px;">
        <div style="background:var(--bg3); padding:16px; border-radius:8px;">
          <h4 id="lbl-iv-dist" style="margin-bottom:12px; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px;">Rozkład IV</h4>
          <div style="height:150px; position:relative;"><canvas id="chart-iv"></canvas></div>
        </div>
        <div style="background:var(--bg3); padding:16px; border-radius:8px;">
          <h4 id="lbl-type-dist" style="margin-bottom:12px; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px;">Rozkład Typów</h4>
          <div style="height:150px; position:relative;"><canvas id="chart-types"></canvas></div>
        </div>
      </div>
      <div style="margin-top:16px; background:var(--bg3); padding:12px 16px; border-radius:8px; display:flex; gap:16px; align-items:center; flex-wrap:wrap;">
        <div>
          <span id="lbl-nando-tracker" style="font-size:12px; color:var(--muted);">Rzadkie okazy (0% IV - Nando):</span>
          <strong id="nando-list-label" style="font-size:13px; color:var(--red); margin-left:6px;">0</strong>
        </div>
        <div id="nando-names-container" style="font-size:11px; color:var(--text); display:flex; gap:6px; flex-wrap:wrap;"></div>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <input type="text" id="poke-search" placeholder="Szukaj nazwy…">
    <select id="poke-filter">
      <option value="all">Wszystkie</option>
      <option value="hundo">💯 Hundo</option>
      <option value="shiny">✨ Shiny</option>
      <option value="shadow">👻 Shadow</option>
      <option value="lucky">🍀 Lucky</option>
      <option value="tier_s">Tier S (meta)</option>
      <option value="tier_a">Tier A (meta)</option>
      <option value="trash">🗑️ Kandydaci do transferu</option>
      <option value="y2016">📅 2016–2018 (lucky)</option>
      <option value="y2022">📅 2019–2022 (lucky)</option>
      <option value="pvp_gem">🏆 PvP Gemy GL (rank ≤250)</option>
    </select>
    <select id="poke-sort">
      <option value="cp">CP ↓</option>
      <option value="iv">IV% ↓</option>
      <option value="lvl">Level ↓</option>
      <option value="name">Nazwa A→Z</option>
    </select>
    <span class="count-label" id="poke-count"></span>
  </div>
  
  {% include 'partials/regex_bar.html' %}
  
  <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px">
    <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)">
      <span id="lbl-tags-lbl" style="font-weight:700;font-family:var(--fh);font-size:10px;text-transform:uppercase;letter-spacing:.8px">Tagi:</span>
      <span class="badge badge-shiny" data-tooltip="Shiny pokemon">✨ Shiny</span>
      <span class="badge badge-shadow" data-tooltip="Shadow pokemon — +20% ataku">Shadow</span>
      <span class="badge badge-hundo" data-tooltip="100% IV — idealne statystyki">💯 Hundo</span>
      <span class="badge badge-lucky" data-tooltip="Lucky pokemon — tańszy power-up">🍀 Lucky</span>
      <span class="badge badge-event" data-tooltip="Pokemon pojawia się w aktywnym lub nadchodzącym evencie">📅 Event</span>
    </div>
    <button class="btn btn-outline btn-sm" id="btn-export-csv">📥 Export CSV</button>
    <a class="btn btn-outline btn-sm" id="btn-raw-csv" href="/api/export/raw-csv" download="pogo_raw_export.csv" data-tooltip="Pełny eksport 1:1 z PGSStats.json — wszystkie 80 pól + nazwa gatunku">📦 Raw JSON→CSV</a>
    <a class="btn btn-outline btn-sm" id="btn-inventory-csv" href="/api/export/inventory-csv" download="pogo_inventory.csv" data-tooltip="Stardust, PokéCoiny, Rare Candy + pełna lista ekwipunku">💰 Ekwipunek CSV</a>
  </div>
  <div class="tbl-wrap">
    <table id="poke-table">
      <thead><tr>
        <th>Pokemon</th><th>CP</th><th>Lvl</th><th>IV%</th>
        <th>A/D/S</th><th>Rok</th><th>Meta</th><th>Tagi</th><th>AI</th>
      </tr></thead>
      <tbody id="poke-tbody"></tbody>
    </table>
  </div>
</div>
