<div class="panel" id="panel-settings">
  <div class="panel-title" id="settings-panel-title">⚙️ Ustawienia</div>
  <div class="card">
    <div class="card-title" id="settings-ai-config-title">Konfiguracja AI</div>
    <div class="settings-section">
      <h3 id="settings-provider-h3">Provider</h3>
      <div class="form-row">
        <label>AI Provider</label>
        <select id="cfg-provider">
          <option value="gemini">Google Gemini</option>
          <option value="azure">Azure OpenAI</option>
          <option value="openai">OpenAI</option>
          <option value="anthropic">Anthropic (Claude)</option>
        </select>
      </div>
    </div>
    <div class="settings-section">
      <h3 id="settings-apikeys-h3">Klucze API</h3>
      <div class="form-row"><label>Gemini API Key</label><input type="password" id="cfg-gemini" placeholder="AIza…"></div>
      <div class="form-row"><label>OpenAI API Key</label><input type="password" id="cfg-openai" placeholder="sk-…"></div>
      <div class="form-row"><label>Anthropic API Key</label><input type="password" id="cfg-anthropic" placeholder="sk-ant-…"></div>
      <div class="form-row"><label>Azure Endpoint</label><input type="text" id="cfg-azure-ep" placeholder="https://…openai.azure.com"></div>
      <div class="form-row"><label>Azure API Key</label><input type="password" id="cfg-azure-key" placeholder="…"></div>
    </div>
    <button class="btn btn-primary" id="btn-save-cfg">💾 Zapisz konfigurację</button>
    <span id="cfg-saved" style="margin-left:10px;font-size:12px;color:var(--green);display:none">✓ Zapisano</span>
  </div>

  <div class="card">
    <div class="card-title" id="settings-cache-title">📦 Cache AI (SQLite)</div>
    <p id="settings-cache-desc" style="font-size:12px;color:var(--muted);margin-bottom:10px">
      Odpowiedzi AI zapisywane wg hasha statystyk — ta sama kombinacja IV/CP nie kosztuje tokenu drugi raz.
    </p>
    <div class="cache-bar" id="cache-stats">
      <span class="cache-stat" id="cs-total-lbl">Łącznie: <b id="cs-total">—</b></span>
      <span class="cache-stat" id="cs-today-lbl">Dziś: <b id="cs-today">—</b></span>
      <span class="cache-stat" id="cs-saved-lbl">Szac. zaoszczędzone: <b id="cs-saved">—</b> USD</span>
    </div>
  </div>
</div>
